<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift Calendar Control Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&family=Roboto+Mono:wght@400;700&family=Roboto:wght@100;300;400;500;700;900&family=Noto+Serif:wght@400;700&family=Coming+Soon&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1412; --panel: #161d1a; --panel2: #1c2521; --line: #2a3530; --fg: #e6eee9; --muted: #93a49b;
  --accent: #8fe3b0; --accent-ink: #0b1a12; --warn: #ffb36b; --bad: #ff7a6b; --good: #8fe3b0;
}
:root[data-theme="light"] { --bg:#eef2ef; --panel:#fff; --panel2:#f5f8f6; --line:#d5ddd8; --fg:#14201a; --muted:#5a6b62; --accent:#2e7d57; --accent-ink:#fff; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#eef2ef; --panel:#fff; --panel2:#f5f8f6; --line:#d5ddd8; --fg:#14201a; --muted:#5a6b62; --accent:#2e7d57; --accent-ink:#fff; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header.top { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
header.top h1 { font: 700 18px/1 "Roboto Condensed", system-ui, sans-serif; margin: 0 8px 0 0; letter-spacing: .02em; }
.conn { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.conn label { color: var(--muted); font-size: 12px; }
.conn input { width: 170px; }
.conn input.pin { width: 70px; letter-spacing: .2em; font-family: "Roboto Mono", monospace; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
button.send { font-size: 16px; padding: 8px 22px; }
button.small { padding: 2px 8px; font-size: 12px; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
textarea { width: 100%; font-family: "Roboto Mono", ui-monospace, monospace; font-size: 12px; }
#status { font-size: 13px; color: var(--muted); flex: 1 1 260px; min-width: 0; }
#status.good { color: var(--good); } #status.bad { color: var(--bad); } #status.warn { color: var(--warn); }
main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; padding: 16px; align-items: start; }
@media (max-width: 980px) { main { grid-template-columns: 1fr; } .previewCol { position: static !important; order: -1; } }
.controls { min-width: 0; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
nav.tabs button { border-radius: 999px; font-size: 13px; }
nav.tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
section.pane { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 16px 14px; }
section.pane.on { display: block; }
.pane h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 6px; }
.row { display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr); gap: 4px 14px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.row:last-child { border-bottom: 0; }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
.row > label { color: var(--fg); }
.row .help { grid-column: 1 / -1; color: var(--muted); font-size: 12px; margin-top: -2px; }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.ctl input[type=range] { flex: 1 1 160px; min-width: 120px; accent-color: var(--accent); }
.ctl .val { font-family: "Roboto Mono", monospace; font-size: 12px; min-width: 56px; color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); padding: 5px 10px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.sw { width: 34px; height: 26px; border-radius: 6px; border: 1px solid var(--line); padding: 0; cursor: pointer; }
input[type=color] { width: 44px; height: 28px; padding: 1px; }
.hex { width: 92px; font-family: "Roboto Mono", monospace; font-size: 12px; }
.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.rules { display: flex; flex-direction: column; gap: 6px; }
.rule { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rule input.key { width: 110px; text-transform: uppercase; font-family: "Roboto Mono", monospace; }
.strip { display: flex; height: 14px; border-radius: 4px; overflow: hidden; flex: 1 1 200px; min-width: 120px; }
.strip i { flex: 1; }
.cals label { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
.cals .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.previewCol { position: sticky; top: 70px; }
.previewBox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.previewBar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
.previewBar input { width: 64px; }
.wall { border-radius: 14px; padding: 10px; background: linear-gradient(160deg, #3a4f45, #1a2420 55%, #4a3b2c); overflow: auto; max-width: calc(100vw - 32px); }
.wall.plain { background: #000; } .wall.lightwall { background: linear-gradient(160deg, #dfe8e3, #b9c8bf); }
#widget { position: relative; overflow: hidden; border-radius: 8px; transform-origin: top left; }
.muted { color: var(--muted); }
.note { font-size: 12px; color: var(--muted); }
.kbd { font-family: "Roboto Mono", monospace; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
details summary { cursor: pointer; color: var(--muted); }
/* widget pieces */
.w-abs { position: absolute; }
.w-txt { overflow: hidden; white-space: normal; word-break: break-word; }
</style>
</head>
<body>
<header class="top">
  <h1>Shift Calendar · Control Panel</h1>
  <div class="conn">
    <label for="addr">Phone address</label><input id="addr" placeholder="192.168.1.23:8765" spellcheck="false">
    <label for="pin">Code</label><input id="pin" class="pin" maxlength="4" placeholder="0000" inputmode="numeric">
    <button id="btnLoad" title="Load the phone's current settings and your real events for the preview">Load from phone</button>
    <button id="btnSend" class="primary send" title="Send these settings to the widget">Send ➤</button>
  </div>
  <div id="status">Not connected. On your phone open Shift Calendar, tap “Receive settings from computer”, and type the address and code here.</div>
</header>

<main>
  <div class="controls">
    <nav class="tabs" id="tabs"></nav>
    <div id="panes"></div>
  </div>
  <div class="previewCol">
    <div class="previewBox">
      <div class="previewBar">
        <span>Preview</span>
        <label>W <input id="pw" type="number" min="200" max="800" value="384"></label>
        <label>H <input id="ph" type="number" min="200" max="1200" value="680"></label>
        <span>dp</span>
        <label>Zoom <input id="pz" type="number" min="0.5" max="2" step="0.1" value="1"></label>
        <select id="wallSel" title="Wallpaper behind the widget"><option value="">Wallpaper: bush</option><option value="plain">Black</option><option value="lightwall">Light</option></select>
        <label class="chk" title="Pretend it is a different date"><span>Today</span><input id="pToday" type="date"></label>
      </div>
      <div class="wall" id="wall"><div id="widget"></div></div>
      <p class="note" id="srcNote">Showing sample events. Press “Load from phone” to preview your real calendar.</p>
    </div>
  </div>
</main>

<script>
"use strict";
/* ============================================================
   Data copied from the Android app (Pal.java) so the preview matches.
   ============================================================ */
const PRESETS = {
  bush:   { bg:"#101A16", past:"#070B09", future:"#243029", today:"#2F4238", accent:"#8FE3B0", fg:"#E6EEE9", muted:"#8FA39A", sun:"#FF6B5F", dark:true, name:"Bush green" },
  dots:   { bg:"#1C1918", past:"#100D0C", future:"#3B3D44", today:"#5A463A", accent:"#E8C77A", fg:"#F2ECE2", muted:"#A69D92", sun:"#E08F6E", dark:true, name:"Dot painting (slate and ochre)" },
  desert: { bg:"#1A100F", past:"#0D0807", future:"#3D211C", today:"#5E2A1F", accent:"#F0623F", fg:"#F5E8DC", muted:"#B79B8C", sun:"#F2B56B", dark:true, name:"Red desert" },
  fern:   { bg:"#0E130B", past:"#070A05", future:"#2A3420", today:"#3D4D2A", accent:"#A9C47E", fg:"#ECF2E0", muted:"#99A784", sun:"#EB906B", dark:true, name:"Rainforest fern" },
  gum:    { bg:"#181712", past:"#0D0C08", future:"#2F363F", today:"#3F4B59", accent:"#A9C7E3", fg:"#EDEFF1", muted:"#8F959B", sun:"#E59C7C", dark:true, name:"Gum tree and sky" },
  bark:   { bg:"#1A1816", past:"#0E0C0B", future:"#3B3129", today:"#524232", accent:"#DDD1BB", fg:"#F3EEE5", muted:"#A1998A", sun:"#E2936F", dark:true, name:"Pale bark on dark rock" },
  light:  { bg:"#E3EAE5", past:"#C9D3CD", future:"#FFFFFF", today:"#FFFFFF", accent:"#2E7D57", fg:"#14201A", muted:"#5A6B62", sun:"#C2352B", dark:false, name:"Light" },
  custom: { name:"My own colours (base colours below)" }
};
const CYBER = ["#B4E665","#729C63","#A6D4A2","#6FE254","#36752A","#82EA92","#68DC80","#454B49","#44926B","#FFA147","#ECB17B","#59B09E","#265551","#6A96BE","#446FB2","#A0B3D9","#1A22C8","#150F52","#6B58E4","#30127F","#681FD9","#62189A","#9A2BE0","#CB3BE3","#D75FD3","#A44694","#E191C8","#782A4C","#49142A","#DF6E80"];
const CYBER_ORDER = ["#B4E665","#CB3BE3","#FFA147","#6B58E4","#6FE254","#DF6E80","#6A96BE","#9A2BE0","#59B09E","#E191C8","#ECB17B","#446FB2","#82EA92","#D75FD3","#A0B3D9","#681FD9","#68DC80","#A44694","#44926B","#1A22C8","#A6D4A2","#62189A","#729C63","#782A4C","#36752A","#30127F","#265551","#454B49","#49142A","#150F52"];
const SETS = {
  auto: { name:"Follow my calendar palette" },
  bush: { name:"Bush green", c:["#E0604A","#4FB3D9","#F2C14E","#B58BE0","#7FD49B","#F29E6B","#5FD0C5","#E88BB0"] },
  dots: { name:"Dot painting", c:["#E8B84A","#6FA8DC","#D9654A","#F0E6D2","#9FC27A","#C78BD1","#5FBFB0","#E89A7A"] },
  desert: { name:"Red desert", c:["#4FC3D9","#F5C04E","#8FD18A","#F0EAD6","#B79AE8","#FF8A5C","#5F9BE8","#E89AC0"] },
  fern: { name:"Rainforest fern", c:["#F29E4A","#6FC6E8","#E86A8A","#F2E27A","#C29AE8","#A9E07E","#4FD1B0","#F0C9A0"] },
  gum: { name:"Gum tree and sky", c:["#F2A65A","#7FC8F2","#E87A6A","#E8D36A","#9AD48A","#C6A0E8","#5FCFC0","#F0B7C8"] },
  bark: { name:"Pale bark", c:["#7FB8E0","#E8845A","#F0D9A8","#9FCF8F","#D9A0D0","#F2C04E","#6FCFC8","#C9B8F0"] },
  bold: { name:"Bold (strongest contrast)", c:["#FF5252","#40C4FF","#FFD740","#69F0AE","#E040FB","#FF9100","#18FFFF","#F48FB1"] },
  cyber: { name:"Cyberpunk", c:CYBER_ORDER },
  light: { name:"Light", c:["#C62828","#0277BD","#EF6C00","#2E7D32","#6A1B9A","#F9A825","#00838F","#5D4037"], hidden:true },
  custom: { name:"My own list (below)" }
};
const FONTS = {
  "": { name:"Condensed (default)", css:"'Roboto Condensed', 'Arial Narrow', sans-serif", w:400 },
  "sans-serif-condensed-light": { name:"Condensed light", css:"'Roboto Condensed', 'Arial Narrow', sans-serif", w:300 },
  "sans-serif": { name:"Regular", css:"Roboto, Arial, sans-serif", w:400 },
  "sans-serif-light": { name:"Light", css:"Roboto, Arial, sans-serif", w:300 },
  "sans-serif-thin": { name:"Thin", css:"Roboto, Arial, sans-serif", w:100 },
  "sans-serif-medium": { name:"Medium", css:"Roboto, Arial, sans-serif", w:500 },
  "sans-serif-black": { name:"Black (heavy)", css:"Roboto, Arial, sans-serif", w:900 },
  "serif": { name:"Serif", css:"'Noto Serif', Georgia, serif", w:400 },
  "monospace": { name:"Monospace", css:"'Roboto Mono', Consolas, monospace", w:400 },
  "casual": { name:"Casual", css:"'Coming Soon', 'Comic Sans MS', cursive", w:400 },
  "cursive": { name:"Handwriting", css:"'Dancing Script', cursive", w:400 }
};
const DEFAULT_RULES = "ACT=#D50000\nEPA=#F4511E\nVW=#039BE5\nGPH=#F6BF26";

/* ============================================================
   Every setting the panel controls. type: s = text, i = number, cal = calendar list.
   def = what the phone uses when the setting is missing.
   ============================================================ */
const DEF = {
  view:"rolling", rows:4, past:7, roll:"daily", wk:"sun", taper:"some", tapc:"100,80,65,50,45,40", small_pct:45,
  pos:"time", clock:"24", t0:-1, minwin:8, density:"detailed", maxl:3, max:0, over:"start",
  tbold:1, hrs:1, upper:0, loc:0, cbold:1, code:"accent", c_code:"",
  allday:"bottom", mk:"side", maxmk:3, mdp10:0, x_mktext:"",
  tdp10:115, lh:118, ndp10:155, hdp10:150, dowdp10:105, dows:"upper3", font:"",
  pal:"bush", c_bg:"", c_past:"", c_future:"", c_today:"", c_accent:"", c_text:"",
  x_bg:"", x_past:"", x_future:"", x_today:"", x_accent:"", x_fg:"", x_muted:"", x_sun:"", x_now:"", x_dow:"", x_sunday:"", x_head:"", x_num:"", x_evtext:"", x_time:"", x_cancel:"", x_more:"",
  sunred:1, colour:"event", eset:"auto", x_set:"", rules:DEFAULT_RULES,
  opacity:85, op_future:95, op_today:95, op_past:95, op_ev:28, op_pastev:60,
  tpad10:25, nowline:1, nowh10:15, barw10:30,
  h_head:1, h_prev:1, h_next:1, h_add:1, h_today:1, h_set:1, h_arrow:1, h_dow:1,
  inc:"", and:"", exc:"", cancel:"show", tz:"Australia/Perth"
};
const INT_KEYS = new Set(Object.keys(DEF).filter(k => typeof DEF[k] === "number"));
let S = Object.assign({}, DEF);       // the settings being edited
S.cals = null;                       // null = every calendar the phone shows
let PHONE = null;                    // last state loaded from the phone {settings, calendars, events, version}

/* ============================================================
   Small helpers
   ============================================================ */
const $ = s => document.querySelector(s);
const el = (tag, attrs, ...kids) => { const e = document.createElement(tag); if (attrs) for (const [k, v] of Object.entries(attrs)) { if (k === "style" && typeof v === "object") Object.assign(e.style, v); else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v); } for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k)); return e; };
function hex(s, def) { if (s == null) return def; s = String(s).trim(); if (!s) return def; if (!s.startsWith("#")) s = "#" + s; if (/^#[0-9a-f]{6}$/i.test(s)) return s.toUpperCase(); if (/^#[0-9a-f]{8}$/i.test(s)) return ("#" + s.slice(3)).toUpperCase(); if (/^#[0-9a-f]{3}$/i.test(s)) return ("#" + s[1]+s[1]+s[2]+s[2]+s[3]+s[3]).toUpperCase(); return def; }
function rgb(h) { h = hex(h, "#888888"); return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function toHex([r,g,b]) { return "#" + [r,g,b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("").toUpperCase(); }
function lum(h) { const [r,g,b] = rgb(h); return (0.299*r + 0.587*g + 0.114*b) / 255; }
function mix(a, b, t) { const A = rgb(a), B = rgb(b); return toHex(A.map((v, i) => v*(1-t) + B[i]*t)); }
function rgba(h, a255) { const [r,g,b] = rgb(h); return `rgba(${r},${g},${b},${(Math.max(0, Math.min(255, a255))/255).toFixed(3)})`; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = (k) => { const v = Number(S[k]); return Number.isFinite(v) ? v : DEF[k]; };
const on = (k) => num(k) !== 0;
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }

/* ---------- palette, exactly as the phone works it out ---------- */
function palette() {
  let id = S.pal || "bush"; let c;
  if (id !== "custom") c = Object.assign({}, PRESETS[id] || PRESETS.bush);
  else {
    const b = PRESETS.bush; c = {};
    c.bg = hex(S.c_bg, b.bg); c.past = hex(S.c_past, b.past); c.future = hex(S.c_future, b.future);
    c.today = hex(S.c_today, b.today); c.accent = hex(S.c_accent, b.accent); c.fg = hex(S.c_text, b.fg);
    c.dark = lum(c.future) < 0.5; c.muted = mix(c.fg, c.future, 0.4); c.sun = c.dark ? "#FF6B5F" : "#C2352B";
  }
  c.now = c.sun; c.dow = c.muted; c.sunday = c.sun; c.head = c.fg; c.num = c.fg; c.evText = c.fg;
  c.cancel = "#7D8290"; c.more = c.muted; c.time = c.dark ? "#FFFFFF" : "#000000"; c.mkText = "#FFFFFF"; c.timeAuto = true; c.mkAuto = true;
  c.bg = hex(S.x_bg, c.bg); c.past = hex(S.x_past, c.past); c.future = hex(S.x_future, c.future); c.today = hex(S.x_today, c.today); c.accent = hex(S.x_accent, c.accent);
  const fg0 = c.fg; c.fg = hex(S.x_fg, c.fg); if (c.fg !== fg0) { c.head = c.fg; c.num = c.fg; c.evText = c.fg; }
  c.muted = hex(S.x_muted, c.muted); c.dow = c.muted; c.more = c.muted;
  const sun0 = c.sun; c.sun = hex(S.x_sun, c.sun); if (c.sun !== sun0) { c.now = c.sun; c.sunday = c.sun; }
  c.now = hex(S.x_now, c.now); c.dow = hex(S.x_dow, c.dow); c.sunday = hex(S.x_sunday, c.sunday); c.head = hex(S.x_head, c.head); c.num = hex(S.x_num, c.num);
  c.evText = hex(S.x_evtext, c.evText); c.cancel = hex(S.x_cancel, c.cancel); c.more = hex(S.x_more, c.more);
  if (hex(S.x_time, "")) { c.time = hex(S.x_time); c.timeAuto = false; }
  if (hex(S.x_mktext, "")) { c.mkText = hex(S.x_mktext); c.mkAuto = false; }
  if (!on("sunred")) c.sunday = c.dow;
  return c;
}
function eventSet() {
  let e = S.eset || "auto";
  if (e === "custom") { const l = String(S.x_set || "").split(/[,\s]+/).map(x => hex(x, "")).filter(Boolean); if (l.length) return l; e = "auto"; }
  if (e === "auto") e = S.pal === "custom" ? "bush" : (S.pal || "bush");
  return (SETS[e] && SETS[e].c) || SETS.bush.c;
}
function parseRules(text) {
  const out = [];
  for (const line of String(text || "").split("\n")) {
    const eq = line.lastIndexOf("="); if (eq <= 0) continue;
    const w = line.slice(0, eq).trim(), col = hex(line.slice(eq + 1), "");
    if (!w || !col) continue;
    out.push({ key: w.toUpperCase(), re: wordRe(w), col });
  }
  return out;
}
function wordRe(w) { return new RegExp("(^|[^\\p{L}\\p{N}])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "($|[^\\p{L}\\p{N}])", "iu"); }
function words(csv) { return String(csv || "").split(",").map(s => s.trim()).filter(Boolean).map(wordRe); }
function endsWithCode(title, key) {
  const t = title.trim();
  if (!key || t.length <= key.length || !t.endsWith(key)) return false;
  return !/[\p{L}\p{N}]/u.test(t.charAt(t.length - key.length - 1));
}
function display(title, keys, allDay) {
  const ut = title.trim().toUpperCase();
  if (!allDay) for (const k of keys) if (ut.startsWith(k)) return title;
  for (const k of keys) if (endsWithCode(title, k)) { const tt = title.trim(); const o = tt.slice(0, tt.length - k.length).replace(/[\s\-–—:,|/(\[]+$/, ""); return o || title; }
  return title;
}

/* ---------- time zone helpers ---------- */
const fmtCache = {};

        el("button", { class: "small", title: "Move down", onclick: () => { if (i < rs.length - 1) { [rs[i + 1], rs[i]] = [rs[i], rs[i + 1]]; setRules(rs); draw(); } } }, "↓"),
        el("button", { class: "small", onclick: () => { rs.splice(i, 1); setRules(rs); draw(); } }, "Remove")));
    });
    box.append(el("div", null, el("button", { onclick: () => { const rs = rulesList(); const set = eventSet(); rs.push(["", set[rs.length % set.length]]); setRules(rs); draw(); } }, "+ Add a code")));
  };
  draw();
});
function rulesList() { return String(S.rules || "").split("\n").map(l => { const eq = l.lastIndexOf("="); return eq < 0 ? null : [l.slice(0, eq).trim(), l.slice(eq + 1).trim()]; }).filter(Boolean); }
function setRules(rs) { change("rules", rs.map(r => r[0].trim() + "=" + r[1]).join("\n") + (rs.length ? "\n" : "")); }

tab("more", "Save & share", p => {
  A(p, el("h2", null, "Time zone"), row("Time zone", text("tz", "Australia/Perth")));
  A(p, el("h2", null, "No Wi-Fi? Use a settings code"),
    el("p", { class: "note" }, "Copy the code, get it onto your phone (email or message it to yourself), then in the app open “Receive settings from computer” and paste it."),
    row("This panel → phone", el("button", { onclick: async () => { const c = await encodeCode(payload()); await navigator.clipboard.writeText(c).catch(() => {}); codeBox.value = c; status("Settings code copied (" + c.length + " characters).", "good"); } }, "Copy settings code")),
    row("Phone → this panel", el("button", { onclick: async () => { try { const s = await decodeCode(codeBox.value); applyLoaded(s); status("Loaded settings from the code.", "good"); } catch (e) { status("That code didn't work: " + e.message, "bad"); } } }, "Load a settings code (paste below)")));
  const codeBox = el("textarea", { rows: 4, placeholder: "Settings code (starts with SC1)" }); A(p, codeBox);
  A(p, el("h2", null, "Save designs as files"),
    row("Save to a file", el("button", { onclick: () => { const blob = new Blob([JSON.stringify({ app: "Shift Calendar", settings: payload() }, null, 2)], { type: "application/json" }); const a = el("a", { href: URL.createObjectURL(blob), download: "shift-calendar-settings.json" }); document.body.append(a); a.click(); a.remove(); } }, "Download settings (.json)")),
    row("Open a saved file", (() => { const f = el("input", { type: "file", accept: ".json,application/json" }); f.addEventListener("change", async () => { try { const o = JSON.parse(await f.files[0].text()); applyLoaded(o.settings || o); status("Opened " + f.files[0].name, "good"); } catch (e) { status("Couldn't open that file: " + e.message, "bad"); } }); return f; })()),
    row("Start again", el("button", { onclick: () => { if (confirm("Reset every setting in this panel to the app's defaults? (Nothing is sent until you press Send.)")) { S = Object.assign({}, DEF, { cals: S.cals, calsKnown: S.calsKnown, loadedOnce: S.loadedOnce }); save(); build(); render(); } } }, "Reset to defaults")));
  A(p, el("h2", null, "Everything, as text"), el("p", { class: "note" }, "For total control: edit any setting here and press Apply. This is exactly what Send delivers."));
  const raw = el("textarea", { rows: 14 }); raw.value = JSON.stringify(payload(), null, 1);
  A(p, raw, el("div", { style: { marginTop: "6px" } }, el("button", { onclick: () => { try { applyLoaded(JSON.parse(raw.value)); status("Applied.", "good"); } catch (e) { status("Not valid JSON: " + e.message, "bad"); } } }, "Apply")));
});

function build() {
  const tabs = $("#tabs"), panes = $("#panes"); tabs.innerHTML = ""; panes.innerHTML = "";
  for (const t of TABS) {
    tabs.append(el("button", { class: t.id === curTab ? "on" : "", onclick: () => { curTab = t.id; try { localStorage.setItem("sc_tab", t.id); } catch (e) {} build(); } }, t.name));
    if (t.id === curTab) { const p = el("section", { class: "pane on" }); t.build(p); panes.append(p); }
  }
}

/* ============================================================
   Sending, loading and codes
   ============================================================ */
function payload() {
  const o = {};
  for (const k of Object.keys(DEF)) {
    let v = S[k];
    if (INT_KEYS.has(k)) { v = Number(v); if (!Number.isFinite(v)) v = DEF[k]; o[k] = Math.round(v); }
    else { v = v == null ? "" : String(v); o[k] = (/^(x_|c_)/.test(k) && k !== "x_set" && !hex(v, "")) ? null : v; }
  }
  if (S.cals != null) o.cals = S.cals.slice(); else if (S.calsKnown) o.cals = null;   // unknown = leave the phone's choice alone
  return o;
}
function applyLoaded(s) {
  const n = Object.assign({}, DEF);
  // the phone's own text-size choice, if it never had an exact size
  if (s.tdp10 == null && s.size) n.tdp10 = s.size === "s" ? 105 : s.size === "l" ? 130 : 115;
  for (const k of Object.keys(DEF)) if (s[k] !== undefined && s[k] !== null) n[k] = INT_KEYS.has(k) ? Number(s[k]) : String(s[k]);
  if (s.ndp10 == null || s.ndp10 === 0) n.ndp10 = 155; if (s.hdp10 == null || s.hdp10 === 0) n.hdp10 = 150; if (s.dowdp10 == null || s.dowdp10 === 0) n.dowdp10 = 105;
  if (s.view == null && s.view_0 != null) n.view = s.view_0;
  n.cals = Array.isArray(s.cals) ? s.cals.map(String) : null; n.calsKnown = true; n.loadedOnce = S.loadedOnce || !!s.__fromPhone;
  S = n; save(); build(); render();
}
function save() { try { localStorage.setItem("sc_settings", JSON.stringify(S)); } catch (e) {} }
function status(msg, kind) { const s = $("#status"); s.textContent = msg; s.className = kind || ""; }
function base() {
  let a = $("#addr").value.trim().replace(/^https?:\/\//, "").replace(/\/.*$/, "");
  if (!a) throw new Error("Type the phone's address first (shown on the phone, e.g. 192.168.1.23:8765).");
  if (!/:\d+$/.test(a)) a += ":8765";
  const pin = $("#pin").value.trim(); if (!/^\d{4}$/.test(pin)) throw new Error("Type the 4-digit pairing code shown on the phone.");
  try { localStorage.setItem("sc_addr", a); } catch (e) {}
  return { url: "http://" + a, pin };
}
async function call(path, body) {
  const b = base();
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 12000);
  try {
    const r = await fetch(`${b.url}${path}?pin=${b.pin}`, body ? { method: "POST", body: JSON.stringify(body), headers: { "Content-Type": "text/plain" }, signal: ctl.signal } : { signal: ctl.signal });
    const j = await r.json().catch(() => ({}));
    if (r.status === 403) throw new Error("Wrong pairing code. Check the code on the phone (it changes each time that screen opens).");
    if (!r.ok) throw new Error(j.error || ("Phone replied " + r.status));
    return j;
  } catch (e) {
    if (e.name === "AbortError" || e instanceof TypeError) throw new Error("Can't reach the phone. Check: the phone shows the “Receive from computer” screen, both are on the same Wi-Fi, and the address matches. If your browser asked to allow access to local network devices, choose Allow. Otherwise use a settings code (Save & share tab).");
    throw e;
  } finally { clearTimeout(t); }
}
$("#btnLoad").addEventListener("click", async () => {
  try {
    status("Loading from phone…");
    const st = await call("/state");
    PHONE = st; applyLoaded(Object.assign({}, st.settings || {}, { __fromPhone: true }));
    $("#srcNote").textContent = `Showing your real calendar from the phone (${(st.events || []).length} events). App version ${st.version || "?"}.` + (st.note ? " " + st.note : "");
    status(`Loaded from phone (app ${st.version || "?"}).`, "good");
  } catch (e) { status(e.message, "bad"); }
});
$("#btnSend").addEventListener("click", async () => {
  try {
    if (!S.loadedOnce && !confirm("You haven't loaded this phone's current settings yet, so Send will replace them with what's in this panel (including your code colours).\n\nPress Cancel, then “Load from phone” first, to start from what's on the phone. Press OK to send anyway.")) { status("Not sent."); return; }
    status("Sending…");
    const r = await call("/apply", { settings: payload() });
    status(`✓ Sent ${r.applied} settings at ${new Date().toLocaleTimeString()}. The widget has been redrawn.`, "good");
  } catch (e) { status(e.message, "bad"); }
});
async function encodeCode(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  const z = new Uint8Array(await new Response(cs).arrayBuffer());
  let s = ""; for (const b of z) s += String.fromCharCode(b);
  return "SC1" + btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function decodeCode(code) {
  code = code.replace(/\s+/g, "");
  if (code.startsWith("{")) { const o = JSON.parse(code); return o.settings || o; }
  if (!code.startsWith("SC1")) throw new Error("not a Shift Calendar code");
  let b = code.slice(3).replace(/-/g, "+").replace(/_/g, "/"); while (b.length % 4) b += "=";
  const bin = atob(b), z = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) z[i] = bin.charCodeAt(i);
  const ds = new Blob([z]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  const o = JSON.parse(await new Response(ds).text()); return o.settings || o;
}

try {
  const saved = JSON.parse(localStorage.getItem("sc_settings") || "null"); if (saved) S = Object.assign({}, DEF, saved);
  $("#addr").value = localStorage.getItem("sc_addr") || "";
  curTab = localStorage.getItem("sc_tab") || "look"; if (!TABS.some(t => t.id === curTab)) curTab = "look";
} catch (e) {}
for (const id of ["#pw", "#ph", "#pz", "#wallSel", "#pToday"]) $(id).addEventListener("input", render);
build(); render();
setInterval(render, 60000);
